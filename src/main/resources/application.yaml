openrouter:
  api-key: ${OPENROUTER_API_KEY}
  base-url: https://openrouter.ai/api/v1
  models:
    stt: mistralai/voxtral-small-transcribe-3-0
    llm: openai/gpt-4o
  stt:

    diarize-provider: mistral

transcoding:
  # Max rådata per STT-anrop. Base64 blir ~4/3 större: 18 MB -> ~24 MB,
  # under OpenRouters gräns på 25 MB. Större filer transkodas och delas upp.
  max-size-bytes: 18874368    # 18 MB
  bitrate: 48k
  sample-rate: 16000
  # Längd per bit för långa möten. 48 kbps * 1200 s ≈ 7,2 MB per bit.
  chunk-seconds: 1200

server:
  port: 8080

spring:
  application:
    name: meeting-transcribe-api
  config:

    import: optional:file:.env[.properties]
  servlet:
    multipart:

      max-file-size: 2GB
      max-request-size: 2GB

  docker:
    compose:
      enabled: false   # sätt till true (och starta Docker Desktop) när RAG/pgvector ska användas
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
