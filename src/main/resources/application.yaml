openrouter:
  api-key: ${OPENROUTER_API_KEY}
  base-url: https://openrouter.ai/api/v1
  models:
    stt: mistralai/voxtral-small-transcribe-3-0
    llm: openai/gpt-4o
  stt:
    # Slug för leverantören som ska få diarize=true (via provider.options).
    # Lämna tomt för att stänga av, eller om modellen inte stödjer diarisering.
    diarize-provider: mistral

transcoding:
  max-size-bytes: 20971520    # 20 MB
  bitrate: 48k
  sample-rate: 16000

server:
  port: 8080

spring:
  application:
    name: meeting-transcribe-api
  config:
    # Läser lokala hemligheter från .env (gitignorerad). "optional" = ingen krasch om filen saknas,
    # t.ex. i produktion där variablerna sätts som riktiga miljövariabler.
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  # Inaktivera auto-konfiguration av VectorStore och DataSource
  # tills du är redo att sätta upp pgvector + embedding-modell.
  # Ta bort dessa excludes när du konfigurerar RAG.
  docker:
    compose:
      enabled: false   # sätt till true (och starta Docker Desktop) när RAG/pgvector ska användas
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
